name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: nixos
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # No release-type input on purpose: passing it makes the action
          # ignore release-please-config.json (and its extra-files generic
          # updater for mts.cabal), bumping only the manifest. Manifest mode
          # reads release-type "simple" from the config file instead.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Non-GITHUB_TOKEN identity so the release PR's branch push emits
          # pull_request/push events — otherwise GitHub suppresses them for
          # GITHUB_TOKEN-authored commits and the required checks never run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build docker image
        run: nix --quiet build .#docker-image -o mts-image

      - name: Build AppImage
        run: nix --quiet bundle --bundler github:ralismark/nix-appimage .#mts -o mts.AppImage

      - name: Build RPM
        run: nix --quiet bundle --bundler github:NixOS/bundlers#toRPM .#mts -o mts.rpm

      - name: Build DEB
        run: nix --quiet bundle --bundler github:NixOS/bundlers#toDEB .#mts -o mts.deb

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # Copy actual files from bundler outputs (bundlers create directories)
          cp mts.deb/*.deb mts-${TAG}.deb
          cp mts.rpm/*.rpm mts-${TAG}.rpm
          cp -L mts.AppImage mts-${TAG}.AppImage
          cp -L mts-image mts-${TAG}-docker.tar.gz

          nix --quiet shell nixpkgs#gh -c gh release upload "${TAG}" \
            mts-${TAG}.deb \
            mts-${TAG}.rpm \
            mts-${TAG}.AppImage \
            mts-${TAG}-docker.tar.gz \
            --clobber
